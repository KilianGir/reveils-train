<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Réveils Train</title>
<style>
  :root{
    --ink:#0B0D10;
    --panel:#151920;
    --line:#272D37;
    --chalk:#E8E9EB;
    --muted:#858D99;
    --rail:#EB0000;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    min-height:100vh;
    padding:max(20px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    max-width:560px;
    margin:0 auto;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{
    font-family:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono","DejaVu Sans Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }

  /* ---- en-tête ---- */
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
  header h1{font-size:15px;font-weight:650;letter-spacing:-.01em}
  header .dot{width:7px;height:7px;border-radius:50%;background:var(--rail);flex:none;align-self:center}

  /* ---- jours ---- */
  .days{display:flex;gap:6px;margin-bottom:18px}
  .day{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:10px;
    padding:10px 0;
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .day[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}
  .day .morrow{display:block;font-size:9px;letter-spacing:.1em;color:var(--rail);font-weight:700;margin-top:2px}
  .day[aria-pressed="true"] .morrow{color:var(--rail)}

  /* ---- saisie ---- */
  .inputs{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    gap:14px;
    align-items:flex-end;
    margin-bottom:26px;
  }
  .field{flex:1;min-width:0}
  .field label{display:block;margin-bottom:7px}
  input[type=time],input[type=number]{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:9px;
    padding:11px 10px;
    font-size:19px;
    font-weight:600;
  }
  input[type=time]{font-size:22px}
  input[type=number]{-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
  .marge{display:flex;gap:6px;align-items:stretch}
  .marge input{text-align:center}
  .step{
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:9px;
    width:38px;
    flex:none;
    font-size:18px;
    cursor:pointer;
  }
  .step:active{background:var(--line)}

  /* ---- rail : la descente vers le train ---- */
  .rail{position:relative;padding-left:34px}
  .rail::before{
    content:"";position:absolute;left:6px;top:12px;bottom:14px;
    width:1px;background:linear-gradient(var(--line) 0 70%,var(--rail));
  }
  .stop{position:relative;padding:2px 0}
  .stop::before{
    content:"";position:absolute;left:-31px;top:14px;
    width:9px;height:9px;border-radius:50%;
    background:var(--ink);border:1px solid var(--muted);
  }
  .stop.is-train::before{background:var(--rail);border-color:var(--rail);width:13px;height:13px;left:-33px;top:13px}
  .stop .time{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .stop.is-train .time{color:var(--rail)}
  .stop .who{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .stop .veille{color:var(--rail);letter-spacing:.06em}
  .gap{
    font-size:11px;color:var(--muted);
    padding:7px 0 7px 0;
    letter-spacing:.06em;
  }
  .gap.final{color:var(--chalk)}

  .empty{color:var(--muted);font-size:14px;line-height:1.6;padding:8px 0}

  /* ---- réglages ---- */
  details{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  summary{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:" +";color:var(--rail)}
  details[open] summary::after{content:" −"}
  .gaps{display:flex;gap:10px;margin-top:14px}
  .gaps .field label{font-size:10px;letter-spacing:.14em}
  .note{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:14px}

  :focus-visible{outline:2px solid var(--rail);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:360px){
    .inputs{flex-direction:column;align-items:stretch;gap:14px}
    .stop .time{font-size:34px}
  }
</style>
</head>
<body>

<header>
  <span class="dot"></span>
  <h1>Réveils Train</h1>
  <span class="eyebrow" id="dayLabel"></span>
</header>

<nav class="days" id="days" aria-label="Jour de la semaine"></nav>

<div class="inputs">
  <div class="field">
    <label class="eyebrow" for="train">Départ du train</label>
    <input type="time" id="train" class="mono" step="60">
  </div>
  <div class="field" style="max-width:170px">
    <label class="eyebrow" for="marge">Marge avant train</label>
    <div class="marge">
      <button class="step" id="mMinus" aria-label="Réduire la marge de 5 minutes">−</button>
      <input type="number" id="marge" class="mono" min="0" max="240" step="5" inputmode="numeric">
      <button class="step" id="mPlus" aria-label="Augmenter la marge de 5 minutes">+</button>
    </div>
  </div>
</div>

<section class="rail" id="out" aria-live="polite"></section>

<details>
  <summary>Écarts fixes</summary>
  <div class="gaps">
    <div class="field">
      <label class="eyebrow" for="g1">M1 → M2</label>
      <input type="number" id="g1" class="mono" min="1" max="60" inputmode="numeric">
    </div>
    <div class="field">
      <label class="eyebrow" for="g2">M2 → M3</label>
      <input type="number" id="g2" class="mono" min="1" max="60" inputmode="numeric">
    </div>
    <div class="field">
      <label class="eyebrow" for="g3">M3 → Tél.</label>
      <input type="number" id="g3" class="mono" min="1" max="120" inputmode="numeric">
    </div>
  </div>
  <p class="note">L'heure du téléphone est arrondie aux 5 minutes inférieures, jamais vers le haut : la marge réelle avant le train est donc toujours au moins celle demandée. Les alarmes de la montre en découlent par soustraction.</p>
</details>

<script>
(function(){
  'use strict';

  var DAYS   = ['Lun','Mar','Mer','Jeu','Ven'];
  var LONG   = ['lundi','mardi','mercredi','jeudi','vendredi'];
  var KEY    = 'reveils-train.v1';
  var DEF    = {g1:5, g2:5, g3:15};

  var state = load();
  var current = tomorrowIndex();

  var $train = document.getElementById('train');
  var $marge = document.getElementById('marge');
  var $out   = document.getElementById('out');
  var $days  = document.getElementById('days');
  var $label = document.getElementById('dayLabel');
  var $g     = [document.getElementById('g1'),document.getElementById('g2'),document.getElementById('g3')];

  function load(){
    var s = {days:{}, gaps:{g1:DEF.g1, g2:DEF.g2, g3:DEF.g3}};
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && typeof p === 'object'){
          if(p.days && typeof p.days === 'object') s.days = p.days;
          if(p.gaps) for(var k in DEF) if(num(p.gaps[k]) > 0) s.gaps[k] = num(p.gaps[k]);
        }
      }
    }catch(e){ /* stockage indisponible : on repart sur les valeurs par défaut */ }
    return s;
  }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function num(v){ var n = parseInt(v,10); return isNaN(n) ? 0 : n; }

  // Demain, ramené au jour ouvré suivant (samedi/dimanche -> lundi).
  function tomorrowIndex(){
    var d = (new Date().getDay() + 1) % 7;   // 0 = dimanche
    if(d === 0 || d === 6) return 0;
    return d - 1;
  }

  function fmt(mins){
    var m = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(m / 60), mm = m % 60;
    return (h<10?'0':'') + h + ':' + (mm<10?'0':'') + mm;
  }

  function parseTime(v){
    if(!v || v.indexOf(':') < 0) return null;
    var p = v.split(':'), h = num(p[0]), m = num(p[1]);
    if(h < 0 || h > 23 || m < 0 || m > 59) return null;
    return h * 60 + m;
  }

  function buildDays(){
    $days.innerHTML = '';
    DAYS.forEach(function(name, i){
      var b = document.createElement('button');
      b.className = 'day';
      b.type = 'button';
      b.setAttribute('aria-pressed', i === current ? 'true' : 'false');
      b.innerHTML = name + (i === tomorrowIndex() ? '<span class="morrow">demain</span>' : '');
      b.addEventListener('click', function(){ current = i; syncFields(); buildDays(); render(); });
      $days.appendChild(b);
    });
  }

  function dayData(i){
    var d = state.days[i];
    return {
      train: (d && d.train) ? d.train : '',
      marge: (d && num(d.marge) >= 0 && d.marge !== undefined) ? num(d.marge) : 30
    };
  }

  function syncFields(){
    var d = dayData(current);
    $train.value = d.train;
    $marge.value = d.marge;
    $label.textContent = LONG[current];
    $g[0].value = state.gaps.g1;
    $g[1].value = state.gaps.g2;
    $g[2].value = state.gaps.g3;
  }

  function commit(){
    state.days[current] = { train: $train.value, marge: Math.max(0, num($marge.value)) };
    save();
    render();
  }

  function render(){
    var train = parseTime($train.value);
    if(train === null){
      $out.innerHTML = '<p class="empty">Entre l\'heure de départ du train pour voir les quatre alarmes à régler.</p>';
      return;
    }

    var marge = Math.max(0, num($marge.value));
    var g1 = Math.max(1, num(state.gaps.g1));
    var g2 = Math.max(1, num(state.gaps.g2));
    var g3 = Math.max(1, num(state.gaps.g3));

    // Remontée depuis le train ; l'arrondi ne touche que l'alarme du téléphone.
    var phoneRaw = train - marge;
    var phone = Math.floor(phoneRaw / 5) * 5;
    var w3 = phone - g3;
    var w2 = w3 - g2;
    var w1 = w2 - g1;

    var realMargin = train - phone;

    var stops = [
      {t:w1,    who:'Montre 1'},
      {gap:g1},
      {t:w2,    who:'Montre 2'},
      {gap:g2},
      {t:w3,    who:'Montre 3'},
      {gap:g3},
      {t:phone, who:'Téléphone'},
      {gap:realMargin, final:true},
      {t:train, who:'Train', train:true}
    ];

    var html = '';
    stops.forEach(function(s){
      if(s.gap !== undefined){
        html += '<p class="gap' + (s.final ? ' final' : '') + '">' +
                (s.final ? '↓ ' + s.gap + ' min de marge' : '↓ ' + s.gap + ' min') + '</p>';
        return;
      }
      var veille = s.t < 0 ? ' <span class="veille">veille</span>' : '';
      html += '<div class="stop' + (s.train ? ' is-train' : '') + '">' +
                '<p class="time mono">' + fmt(s.t) + '</p>' +
                '<p class="who">' + s.who + veille + '</p>' +
              '</div>';
    });
    $out.innerHTML = html;
  }

  // --- écouteurs ---
  $train.addEventListener('input', commit);
  $marge.addEventListener('input', commit);

  document.getElementById('mMinus').addEventListener('click', function(){
    $marge.value = Math.max(0, num($marge.value) - 5); commit();
  });
  document.getElementById('mPlus').addEventListener('click', function(){
    $marge.value = Math.min(240, num($marge.value) + 5); commit();
  });

  $g.forEach(function(el, i){
    el.addEventListener('input', function(){
      var k = ['g1','g2','g3'][i];
      var v = num(el.value);
      if(v > 0){ state.gaps[k] = v; save(); render(); }
    });
  });

  buildDays();
  syncFields();
  render();

  // --- PWA : manifeste inline, pas de fichier séparé ---
  var icon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
             '<rect width="192" height="192" rx="30" fill="#0B0D10"/>' +
             '<circle cx="96" cy="96" r="58" fill="none" stroke="#E8E9EB" stroke-width="8"/>' +
             '<path d="M96 56v42l30 18" fill="none" stroke="#EB0000" stroke-width="10" stroke-linecap="round"/>' +
             '</svg>';
  var manifest = {
    name:'Réveils Train', short_name:'Réveils', start_url:'.', scope:'.',
    display:'standalone', background_color:'#0B0D10', theme_color:'#0B0D10',
    lang:'fr',
    icons:[{src:'data:image/svg+xml;utf8,' + encodeURIComponent(icon), sizes:'any', type:'image/svg+xml'}]
  };
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);

  // Cache hors-ligne si un sw.js est présent à côté du fichier ; sinon on s'en passe.
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
